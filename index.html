<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Sverige Adventure 1.4</title><style>*{box-sizing:border-box}html,body{margin:0;background:#101b36;color:white;font-family:system-ui;overflow:hidden;touch-action:none;overscroll-behavior:none}#game{width:100vw;height:100dvh;display:block;image-rendering:pixelated}#hud{position:fixed;top:env(safe-area-inset-top);left:12px;font-weight:900;text-shadow:2px 2px #111;font-size:15px;pointer-events:none}#controls{position:fixed;inset:0;pointer-events:none}.btn{pointer-events:auto;position:absolute;bottom:calc(16px + env(safe-area-inset-bottom));width:82px;height:82px;border:2px solid #ffffff88;border-radius:20px;background:#ffffff30;color:#fff;font-size:26px;font-weight:900;touch-action:none;user-select:none}.btn:active,.btn.pressed{background:#ffffff99;transform:scale(.96)}#left{left:12px}#right{left:104px}#jump{right:12px;background:#35a5df88}#shoot{right:104px;background:#ff667988}#start{position:fixed;inset:0;background:#102044e8;display:grid;place-content:center;text-align:center;padding:20px;z-index:3}#start h1{font-size:clamp(27px,8vw,48px);color:#ffe271;text-shadow:4px 4px #bd5a39;margin:0 0 12px}#start p{max-width:440px;line-height:1.45}#play{background:#ffcc4e;color:#222;border:0;border-radius:14px;font-size:22px;font-weight:900;padding:15px 32px}#note{font-size:13px;opacity:.85}#sound{position:fixed;right:10px;top:calc(8px + env(safe-area-inset-top));background:#172c59b0;color:white;border:1px solid #ffffff66;border-radius:9px;padding:7px;z-index:2}@media(min-width:800px){.btn{width:76px;height:76px}} </style></head><body><canvas id="game" width="400" height="225"></canvas><div id="hud"></div><button id="sound">🔊</button><div id="controls"><button class="btn" id="left">◀</button><button class="btn" id="right">▶</button><button class="btn" id="shoot">✦</button><button class="btn" id="jump">▲</button></div><div id="start"><h1>🇸🇪 SVERIGE ADVENTURE</h1><p>Spring, hoppa, samla mynt och skjut laser! Leta efter det hemliga röret efter banans mitt. Simma och samla 50 undervattensmynt.</p><p id="note">Version 1.3 · Laddar spelmotorn…</p><div><button id="play">STARTA SPELET ▶</button></div></div><script>
(()=>{'use strict';document.getElementById('note').textContent='Spelmotorn redo ✓ · Tryck STARTA';const c=document.querySelector('#game'),ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;const hud=document.querySelector('#hud');let audio=null,muted=false;const keys={left:false,right:false,jump:false,shoot:false};const W=400,H=225,ground=184,world=3400;let hero,coins,enemies,bullets,particles,undercoins,under=false,cam=0,score=0,frame=0,won=false,previousJump=false,shootDelay=0,started=false;function beep(f=440,d=.09,type='square',vol=.05){if(muted||!audio)return;try{let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,audio.currentTime);g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}function reset(){hero={x:36,y:135,vx:0,vy:0,w:15,h:23,face:1,grounded:false,air:100};score=0;frame=0;cam=0;under=false;won=false;bullets=[];particles=[];coins=[];undercoins=[];enemies=[];for(let x=105;x<world-90;x+=77)coins.push({x,y:115+Math.sin(x*.021)*19,taken:false});for(let x=330;x<world-200;x+=260)enemies.push({x,y:ground-15,alive:true,dir:1});for(let i=0;i<50;i++)undercoins.push({x:72+(i%10)*32,y:32+Math.floor(i/10)*29,taken:false});}function box(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(Math.round(x),Math.round(y),w,h)}function circle(x,y,r,col){ctx.fillStyle=col;ctx.beginPath();ctx.arc(Math.round(x),Math.round(y),r,0,Math.PI*2);ctx.fill()}function text(s,x,y,color='#fff',size=11){ctx.fillStyle=color;ctx.font=`bold ${size}px monospace`;ctx.fillText(s,Math.round(x),Math.round(y))}function hit(a,b){return a.x<b.x+(b.w||12)&&a.x+a.w>b.x&&a.y<b.y+(b.h||12)&&a.y+a.h>b.y}function pipe(){return {x:2050,y:ground-34,w:32,h:34}}function update(){if(!started||won)return;frame++;const jumpNow=keys.jump;if(under){hero.vx=(keys.right?2:0)-(keys.left?2:0);hero.x=Math.max(6,Math.min(379,hero.x+hero.vx));hero.vy+=(keys.jump?-.24:.12);hero.vy*=.95;hero.vy=Math.max(-2.6,Math.min(2.5,hero.vy));hero.y=Math.max(5,Math.min(196,hero.y+hero.vy));hero.air=Math.max(0,hero.air-.035);if(hero.air===0){leaveWater()}for(let coin of undercoins)if(!coin.taken&&Math.hypot(hero.x-coin.x,hero.y-coin.y)<17){coin.taken=true;score++;beep(780,.07)}if(hero.x>350&&hero.y<49&&keys.jump)leaveWater();if(frame%13===0)particles.push({x:hero.x+7,y:hero.y-3,life:42,water:true});}else{const target=(keys.right?2.8:0)-(keys.left?2.8:0);hero.vx+=(target-hero.vx)*(target===0?.42:.55);if(Math.abs(hero.vx)<.08)hero.vx=0;if(hero.vx)hero.face=Math.sign(hero.vx);hero.x=Math.max(0,Math.min(world-20,hero.x+hero.vx));if(jumpNow&&!previousJump&&hero.grounded){hero.vy=-7.8;hero.grounded=false;beep(520,.12)}hero.vy+=.39;hero.y+=hero.vy;if(hero.y+hero.h>=ground){hero.y=ground-hero.h;hero.vy=0;hero.grounded=true}for(let coin of coins)if(!coin.taken&&Math.hypot(hero.x-coin.x,hero.y-coin.y)<18){coin.taken=true;score++;beep(800,.07)}if(keys.shoot&&shootDelay<=0){bullets.push({x:hero.x+(hero.face>0?16:-5),y:hero.y+10,vx:hero.face*6});shootDelay=15;beep(220,.08,'sawtooth',.035)}shootDelay--;for(let b of bullets)b.x+=b.vx;bullets=bullets.filter(b=>b.x>hero.x-300&&b.x<hero.x+500);for(let e of enemies){if(!e.alive)continue;e.x+=Math.sin(frame*.025+e.x)*.16;for(let b of bullets)if(hit({x:b.x,y:b.y,w:8,h:4},{x:e.x,y:e.y,w:15,h:15})){e.alive=false;b.x=-1000;beep(140,.2)}if(hit(hero,{x:e.x,y:e.y,w:15,h:15})){hero.x=Math.max(0,hero.x-75);hero.vy=-4;beep(100,.25)}}const p=pipe();if(hero.x>p.x-10&&hero.x<p.x+35&&hero.y+hero.h>=p.y&&keys.jump&&keys.right){enterWater()}if(hero.x>world-90){won=true;beep(920,.4)}}cam=Math.max(0,Math.min(world-W,hero.x-110));particles=particles.filter(p=>p.life-->0);for(let p of particles)p.y-=.75;previousJump=jumpNow;}function enterWater(){under=true;hero.x=22;hero.y=85;hero.vy=0;hero.air=100;beep(330,.3,'sine')}function leaveWater(){under=false;hero.x=2095;hero.y=ground-hero.h-4;hero.vy=-3;beep(600,.3,'sine')}function drawHero(x,y){box(x+4,y+8,10,12,'#d9414c');box(x+2,y+1,12,10,'#f7c6a1');box(x+2,y,13,4,'#244d8b');box(x+5,y+4,3,2,'#172438');box(x+4,y+19,4,5,'#253c73');box(x+11,y+19,4,5,'#253c73');if(under){box(x-4,y+9,6,13,'#a5b9c6');box(x-2,y+1,21,15,'#a9eaff55');ctx.strokeStyle='#c8f7ff';ctx.lineWidth=2;ctx.strokeRect(Math.round(x-2),Math.round(y),20,16);box(x+2,y+23,8,4,'#f5c34a');box(x+11,y+23,8,4,'#f5c34a')}}function draw(){if(under){box(0,0,W,H,'#07547b');for(let i=0;i<12;i++){let x=i*42+Math.sin(frame*.015+i)*6;box(x,0,13,H,'#0a648655')}for(let i=0;i<16;i++)circle((i*57+frame*.17)%W,(i*37+frame*.4)%H,1.5,'#74d8ef55');box(0,210,W,15,'#b7a26d');for(let i=0;i<12;i++){let x=i*36+7;box(x,199,3,11,'#1bba8b')}for(let coin of undercoins)if(!coin.taken){circle(coin.x+5,coin.y+5,5,'#ffcc35');circle(coin.x+5,coin.y+5,2,'#fff0a0')}for(let p of particles)if(p.water){ctx.strokeStyle='#b7f5ff';ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.stroke()}drawHero(hero.x,hero.y);text('DYKVÄRLD  '+undercoins.filter(q=>q.taken).length+'/50',8,15);text('LUFT '+Math.ceil(hero.air)+'%',290,15);text('UTGÅNG ↑',324,35,'#ffe27d',9);box(361,0,36,7,'#ffe27d')}else{box(0,0,W,H,'#76c9f4');circle(325,40,24,'#fff3a1');for(let i=0;i<7;i++){let x=(i*91-cam*.18)%530;if(x<0)x+=530;circle(x,43+(i%3)*16,14,'#fff');circle(x+17,42+(i%3)*16,17,'#fff')}for(let i=0;i<16;i++){let x=i*120-cam*.35;box(x,116,80,68,'#4b9e7b');box(x+12,100,55,20,'#4b9e7b')}box(0,ground,W,H-ground,'#ad7449');box(0,ground,W,9,'#6bc85b');for(let x=-(cam%25);x<W;x+=25)box(x,195,3,3,'#7e5035');for(let coin of coins)if(!coin.taken&&coin.x-cam>-12&&coin.x-cam<W+12){circle(coin.x-cam,coin.y,6,'#ffbf29');box(coin.x-cam-1,coin.y-4,3,8,'#fff19a')}for(let e of enemies)if(e.alive){let x=e.x-cam;if(x>-20&&x<W){box(x,e.y,15,15,'#b34b70');box(x+3,e.y+4,3,3,'#fff');box(x+10,e.y+4,3,3,'#fff')}}let p=pipe(),px=p.x-cam;if(px>-40&&px<W){box(px+3,p.y,26,34,'#238e53');box(px,p.y,32,9,'#3de27c');box(px+7,p.y+12,4,19,'#5af293');text('↓ BONUS',px-12,p.y-8,'#153c5a',9)}for(let b of bullets)box(b.x-cam,b.y,9,3,'#fffa8b');drawHero(hero.x-cam,hero.y);if(hero.x>world-280){text('MÅL →',world-130-cam,140,'#173d5e',14);box(world-45-cam,ground-70,3,70,'#fff');box(world-42-cam,ground-70,26,18,'#f1d453')}}box(0,218,W,7,'#172a46');hud.textContent='🪙 '+score+'   '+(under?'🌊 HEMLIG VÄRLD':'🇸🇪 SVERIGE');if(won){box(50,60,300,95,'#17365d');text('BANAN KLAR!',92,100,'#ffe67c',24);text('MYNT: '+score,145,124,'#fff',14);text('Tryck på skärmen för omstart',73,145,'#fff',10)}}function loop(){update();draw();requestAnimationFrame(loop)}// iPhone-safe controls: track each active touch globally, never latch a direction.
const held={left:new Set(),right:new Set(),jump:new Set(),shoot:new Set()};
const controls=['left','right','jump','shoot'];
const activeTouches=new Map();
function syncControls(){
 for(const k of controls){
  keys[k]=held[k].size>0;
  document.getElementById(k).classList.toggle('pressed',keys[k]);
 }
}
function releaseTouch(id){
 for(const k of controls)held[k].delete(id);
 activeTouches.delete(id);syncControls();
}
function clearControls(){
 activeTouches.clear();for(const k of controls)held[k].clear();syncControls();
 hero.vx=0;
}
function touchKey(target){
 const el=target&&target.closest?target.closest('[data-control]'):null;
 return el?el.dataset.control:null;
}
for(const k of controls){
 const el=document.getElementById(k);
 el.dataset.control=k;
 el.style.touchAction='none';
 el.addEventListener('contextmenu',e=>e.preventDefault());
}
// Global touch listeners still receive release events after fingers leave a button.
document.addEventListener('touchstart',e=>{
 let handled=false;
 for(const t of e.changedTouches){
  const key=touchKey(t.target);
  if(!key)continue;
  const id='t'+t.identifier;
  releaseTouch(id);activeTouches.set(id,key);held[key].add(id);handled=true;
 }
 if(handled){e.preventDefault();syncControls();}
},{passive:false});
document.addEventListener('touchmove',e=>{
 let handled=false;
 for(const t of e.changedTouches){
  const id='t'+t.identifier;
  if(!activeTouches.has(id))continue;
  handled=true;
  // A finger moved away from its original button: release it immediately.
  const origin=document.getElementById(activeTouches.get(id));
  const r=origin.getBoundingClientRect();
  if(t.clientX<r.left-12||t.clientX>r.right+12||t.clientY<r.top-12||t.clientY>r.bottom+12)releaseTouch(id);
 }
 if(handled)e.preventDefault();
},{passive:false});
for(const eventName of ['touchend','touchcancel'])document.addEventListener(eventName,e=>{
 let handled=false;
 for(const t of e.changedTouches){const id='t'+t.identifier;if(activeTouches.has(id)){releaseTouch(id);handled=true;}}
 if(handled)e.preventDefault();
},{passive:false});
// Mouse support for desktop testing. Touch devices use the listeners above.
for(const k of controls){
 const el=document.getElementById(k);
 el.addEventListener('pointerdown',e=>{
  if(e.pointerType==='touch')return;
  e.preventDefault();held[k].add('mouse');syncControls();
 });
}
for(const type of ['pointerup','pointercancel'])window.addEventListener(type,e=>{
 if(e.pointerType==='touch')return;
 for(const k of controls)held[k].delete('mouse');syncControls();
});
window.addEventListener('blur',clearControls);
document.addEventListener('visibilitychange',()=>{if(document.hidden)clearControls()});
window.addEventListener('pagehide',clearControls);
window.addEventListener('keydown',e=>{let k={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'jump',' ':'jump',KeyZ:'jump',KeyX:'shoot'}[e.code];if(k){held[k].add('keyboard');syncControls();e.preventDefault()}});
window.addEventListener('keyup',e=>{let k={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'jump',' ':'jump',KeyZ:'jump',KeyX:'shoot'}[e.code];if(k){held[k].delete('keyboard');syncControls()}});
function startGame(e){if(e)e.preventDefault();document.querySelector('#start').style.display='none';started=true;try{const AC=window.AudioContext||window.webkitAudioContext;if(AC){audio=new AC();const r=audio.resume();if(r&&r.catch)r.catch(()=>{});beep(660,.16)}}catch(err){audio=null;}}document.querySelector('#play').addEventListener('click',startGame,false);document.querySelector('#play').addEventListener('touchend',startGame,{passive:false});document.querySelector('#sound').onclick=()=>{muted=!muted;document.querySelector('#sound').textContent=muted?'🔇':'🔊'};c.addEventListener('pointerdown',()=>{if(won)reset()});reset();loop()})();
</script><script>window.addEventListener("error",function(e){var n=document.getElementById("note");if(n)n.textContent="Tekniskt fel: "+e.message;});</script></body></html>
