;padding:7px;z-index:2}@media(min-width:800px){.btn{width:76px;height:76px}} </style></head><body><canvas id="game" width="400" height="225"></canvas><div id="hud"></div><button id="sound">🔊</button><div id="controls"><button class="btn" id="left">◀</button><button class="btn" id="right">▶</button><button class="btn" id="shoot">✦</button><button class="btn" id="jump">▲</button></div><div id="start"><div class="globe" role="img" aria-label="Jordglob">🌍</div><h1>ROMINOR SMART TEAM<br>GLOBAL ADVENTURE</h1><p>Välj vilket land du vill spela! Spring, hoppa, samla mynt och besegra bossarna.</p><p id="note">Version 4.1 · Laddar spelmotorn…</p><div style="margin:12px 0 8px"><label for="playerName" style="color:#fff4b4;font-weight:bold">HJÄLTENS NAMN</label><div><input id="playerName" maxlength="12" autocomplete="nickname" placeholder="Skriv ditt namn" style="width:190px;max-width:80%;padding:9px;font:bold 16px monospace;border:2px solid #ffd36a;border-radius:7px;background:#f8f6e8;color:#142d48;text-align:center;text-transform:uppercase"></div></div><div style="margin:8px auto 14px;max-width:300px"><label for="stageSelect" style="display:block;color:#fff4b4;font-weight:900;margin-bottom:7px">VÄLJ STARTBANA</label><select id="stageSelect" style="width:100%;padding:12px 14px;border:2px solid #ffd36a;border-radius:10px;background:#f8f6e8;color:#142d48;font-size:17px;font-weight:800"><option value="sweden">🇸🇪 Sverige – Snil-Jans</option><option value="england">🇬🇧 England – London</option><option value="holland">🇳🇱 Holland – Kanalerna</option><option value="winter">🌌 Vinternatt – Norrsken</option></select></div><div><button id="play">STARTA SPELET ▶</button></div></div><script>
(()=>{'use strict';document.getElementById('note').textContent='Spelmotorn redo ✓ · Tryck STARTA';const c=document.querySelector('#game'),ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;const hud=document.querySelector('#hud');let audio=null,muted=false;const keys={left:false,right:false,jump:false,shoot:false};const W=400,H=225,ground=184;let world=3400,level='sweden',englandComplete=false;let hollandComplete=false,ropeHeld=false,ropeAngle=-.67,ropeSpeed=0,ropeCooldown=0;let flightTimer=0,flightDone=false,playerName='HJÄLTEN',scoreSaved=false;

d(y))}function hit(a,b){return a.x<b.x+(b.w||12)&&a.x+a.w>b.x&&a.y<b.y+(b.h||12)&&a.y+a.h>b.y}// World geometry: first stream requires jumps; other streams have wooden bridges.

 score+=5;

 // Airport departure and flight to England; no external assets.

 ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 for(let i=0;i<9;i++){let x=((i*91-t*(t>115?1.5:.15))%520+520)%520-60,y=25+(i*37)%98;
 circle(x,y,13,'#f8fbff');circle(x+13,y+4,11,'#f8fbff');circle(x-12,y+5,9,'#f8fbff');}

 if(departing){

 }
 box(12,9,376,19,'#163c64');text(t<115?'AVGÅNG FRÅN SNIL-JANS AIRPORT':'PÅ VÄG MOT ENGLAND',30,22,'#fff3c2',12);

 }

function pipe(){return {x:2050,y:ground-34,w:32,h:34}}function update(){if(!started)return;if(level==='hollandFlight'){updateHollandFlight();return;}if(level==='airBonus'){updateAirBonus();return;}if(level==='fishing'){updateFishing();return;}if(won){if(!flightDone){flightTimer++;if(flightTimer>=400){startEngland();}}return;}frame++;if(bonusNotice>0)bonusNotice--;updateFerry();if(boss.inv>0)boss.inv--;
if(level==='sweden'&&!under&&boss.phase==='fight'&&hero.x>3000){
 boss.x=boss.homeX+Math.sin(frame*.045)*24;
 boss.dir=hero.x<boss.x?-1:1;
 if(--boss.throwDelay<=0){
  const dir=boss.dir;
  chairs.push({x:boss.x+(dir<0?-10:25),y:boss.y+13,vx:dir*(2.3+Math.min(1.1,(10-boss.hp)*.1)),vy:-3.7,angle:0,life:145});
  boss.throwDelay=95+Math.floor(Math.random()*35);
  beep(165,.12,'sawtooth',.04);
 }
}
if(!under){for(const ch of chairs){ch.x+=ch.vx;ch.y+=ch.vy;ch.vy+=.16;ch.angle+=ch.vx*.055;ch.life--;
 if(ch.life>0&&hit(hero,{x:ch.x-6,y:ch.y-7,w:13,h:13})){
  ch.life=0;hero.x=Math.max(3095,hero.x+(ch.vx<0?-42:42));hero.vy=-4;burst(ch.x,ch.y);beep(95,.23,'sawtooth');
 }
 if(ch.y>ground-7){ch.life=0;burst(ch.x,ch.y);}
}chairs=chairs.filter(ch=>ch.life>0);

function drawBackdrop(){
 if(!backdropReady){box(0,0,W,ground,'#8fc9df');return;}
 const tile=445, shift=(cam*.095)%tile;
 ctx.imageSmoothingEnabled=false;
 for(let i=-1;i<3;i++){
  const x=Math.round(i*tile-shift);
  if(i%2){ctx.save();ctx.translate(x+tile,0);ctx.scale(-1,1);ctx.drawImage(backdrop,0,0,tile,ground+7);ctx.restore();}
  else ctx.drawImage(backdrop,x,0,tile,ground+7);
 }
 // A faint atmospheric veil keeps foreground platforms readable.
 box(0,125,W,ground-125,'#a5e2dd1b');
}


let bonusReturnX=0,bonusDone=false,bonusOpen=false,bonusChest=false,bonusNotice=0;
let noverly={x:610,y:ground-51,hp:20,maxHp:20,inv:0,throwDelay:80,dir:-1};
let disks=[];
let roonjas={x:2110,y:ground-53,w:32,h:53,hp:50,maxHp:50,inv:0,throwDelay:45,phase:'fight',timer:0};
let eggs=[];
function updateRoonjas(){
 if(level!=='england')return;
 if(roonjas.phase==='defeated')return;
 if(roonjas.phase==='explode'){
  roonjas.timer++;
  if(roonjas.timer%5===0)burst(roonjas.x+16+(Math.random()-.5)*32,roonjas.y+23,true);
  if(roonjas.timer>85){roonjas.phase='defeated';eggs=[];beep(940,.4,'sine');}
  return;
 }
 if(roonjas.inv>0)roonjas.inv--;
 roonjas.x=2110+Math.sin(frame*.035)*23;
 if(hero.x>1810&&--roonjas.throwDelay<=0){
  const direction=hero.x<roonjas.x?-1:1;
  // Random upward launch velocity and speed produce varied egg arcs.
  eggs.push({x:roonjas.x+16,y:roonjas.y+20,vx:direction*(2.3+Math.random()*1.9),vy:-2.4-Math.random()*3.5,life:170,rot:0});
  roonjas.throwDelay=30+Math.floor(Math.random()*32);
  beep(240,.07,'square',.03);
 }
 for(const egg of eggs){
  egg.x+=egg.vx;egg.y+=egg.vy;egg.vy+=.15;egg.rot+=.16;egg.life--;
  if(egg.life>0&&hit(hero,{x:egg.x-6,y:egg.y-8,w:12,h:16})){
   egg.life=0;hero.x=Math.max(1850,hero.x+(egg.vx<0?-36:36));hero.vy=-4;
   burst(egg.x,egg.y);beep(110,.16);
  }
  if(egg.y>ground-6){egg.life=0;burst(egg.x,ground-7);}
 }
 eggs=eggs.filter(e=>e.life>0&&e.x>0&&e.x<world);
 for(const b of bullets){
  if(roonjas.inv===0&&b.x>roonjas.x-6&&b.x<roonjas.x+roonjas.w+5&&b.y>roonjas.y&&b.y<roonjas.y+roonjas.h){
   b.x=-1000;roonjas.hp--;roonjas.inv=6;burst(roonjas.x+15,roonjas.y+22);
   beep(250+roonjas.hp*5,.07,'sawtooth',.035);
   if(roonjas.hp<=0){roonjas.phase='explode';roonjas.timer=0;smokeVictory(roonjas.x+15,roonjas.y+22);eggs=[];burst(roonjas.x+15,roonjas.y+22,true);beep(90,.55,'sawtooth');}
   break;
  }
 }
 if(hit(hero,{x:roonjas.x+3,y:roonjas.y+3,w:26,h:49})){
  hero.x=Math.max(1870,hero.x-42);hero.vy=-4;beep(110,.16);
 }
 if(hero.x>roonjas.x-12){hero.x=roonjas.x-12;hero.vx=0;}
}

 if(r.phase==='explode'){
  for(let i=0;i<9;i++){const a=i*Math.PI*2/9+frame*.12,rad=6+r.timer*.55;
   circle(x+16+Math.cos(a)*rad,y+22+Math.sin(a)*rad,3+(i%3)*2,i%2?'#ffe36d':'#87d7ff');}

 box(x+13,y+13,3,3,'#28313b');box(x+22,y+13,3,3,'#28313b');
 // Suit lapels, pockets, cuffs, hair shine and facial expression.
 box(x+7,y+23,7,2,'#84b7f5');box(x+22,y+23,6,2,'#84b7f5');
 box(x+8,y+28,5,2,'#172f73');box(x+23,y+29,5,2,'#172f73');
 box(x+5,y+39,6,3,'#f5f5f1');box(x+28,y+39,5,3,'#f5f5f1');
 box(x+10,y+2,12,2,'#4d5664');box(x+25,y+5,4,1,'#4d5664');
 box(x+12,y+11,5,1,'#6b4e45');box(x+21,y+11,5,1,'#6b4e45');
 box(x+17,y+17,7,1,'#985f5c');box(x+13,y+32,3,2,'#e6e6ef');
 text('ROONJAS',x-13,y-26,'#fff2bf',12);
 box(x-24,y-20,80,8,'#1c2940');box(x-23,y-19,78*r.hp/r.maxHp,6,'#53a6ed');
 text(r.hp+'/50',x+3,y-31,'#ffffff',9);
}

// Fishing mini-game: a pier, casting float, timed bites, and 10 fish maximum.
let fishingDone=false,fishCaught=0,fishMode='ready',fishTimer=0,fishPrevShoot=false,fishFloatX=282,fishFloatY=148,fishReel=0,fishMsg=0;
function enterFishing(){
 level='fishing';fishCaught=0;fishMode='ready';fishTimer=0;fishPrevShoot=!!keys.shoot;fishMsg=0;fishReel=0;
 bullets=[];particles=[];hero.vx=0;hero.vy=0;beep(500,.18,'sine');
}
function exitFishing(){
 level='holland';fishingDone=true;hero.x=2305;hero.y=ground-hero.h;hero.vx=0;hero.vy=0;hero.grounded=true;
 cam=Math.max(0,Math.min(world-W,hero.x-110));bullets=[];particles=[];shootDelay=15;previousJump=!!keys.jump;
 beep(800,.3,'sine');
}
function updateFishing(){
 frame++;fishTimer++;if(fishMsg>0)fishMsg--;
 const press=!!keys.shoot&&!fishPrevShoot;fishPrevShoot=!!keys.shoot;
 if(fishMode==='ready'&&press){fishMode='casting';fishTimer=0;fishFloatX=125;fishFloatY=116;beep(460,.13,'sine');}
 else if(fishMode==='casting'){
  const t=Math.min(1,fishTimer/32);fishFloatX=125+t*158;fishFloatY=116-42*Math.sin(t*Math.PI)+32*t;
  if(t>=1){fishMode='waiting';fishTimer=0;}
 }else if(fishMode==='waiting'){
  fishFloatY=148+Math.sin(frame*.12)*2;
  if(fishTimer>=60+fishCaught*8+Math.floor(Math.sin(fishCaught*19)*23+23)){fishMode='bite';fishTimer=0;beep(910,.12,'square');}
 }else if(fishMode==='bite'){
  fishFloatY=151+Math.sin(frame*.65)*5;
  if(press){fishMode='reeling';fishTimer=0;fishReel=0;beep(700,.15,'sine');}
  else if(fishTimer>95){fishMode='waiting';fishTimer=0;fishMsg=65;}
 }else if(fishMode==='reeling'){
  fishReel=Math.min(1,fishTimer/47);
  fishFloatX=283-158*fishReel;fishFloatY=148-25*Math.sin(fishReel*Math.PI)-29*fishReel;
  if(fishReel>=1){
   fishCaught++;score+=50;burst(180,95,true);beep(1080,.24,'sine');fishMode='caught';fishTimer=0;fishMsg=105;
  }
 }else if(fishMode==='caught'&&fishTimer>70){
  if(fishCaught>=10){exitFishing();return;}
  fishMode='ready';fishTimer=0;
 }
}
function drawFishing(){
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#7fc8e3');g.addColorStop(1,'#d6e4b6');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 circle(333,33,19,'#ffeba1');
 for(let i=0;i<5;i++)drawWindmill(50+i*105-frame*.05,134,.38,frame*.015+i);
 box(0,119,W,18,'#91b26d');box(0,135,W,H-135,'#338cb1');
 for(let i=0;i<16;i++){let x=i*31+(frame*.25%31);box(x,161+i%4*12,18,2,'#8bd8e5');}
 // Pier extends from left shore into water.
 box(0,142,180,14,'#94663d');box(0,141,180,4,'#d6a66b');
 for(let x=12;x<180;x+=22)box(x,143,2,11,'#65482f');
 box(26,155,12,65,'#67492f');box(144,155,12,65,'#67492f');
 // Detailed hero on the fishing pier.
 ctx.save();ctx.translate(111,102);ctx.scale(1.65,1.65);drawHero(0,0);ctx.restore();
 // Rod and line.
 ctx.strokeStyle='#55412e';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(142,123);ctx.lineTo(176,61);ctx.stroke();
 if(fishMode!=='ready'&&fishMode!=='caught'){
  ctx.strokeStyle='#f4f1d6';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(176,61);ctx.lineTo(fishFloatX,fishFloatY);ctx.stroke();
  circle(fishFloatX,fishFloatY,5,'#f3ede5');box(fishFloatX-4,fishFloatY-5,8,5,'#ef4f42');
 }
 if(fishMode==='bite'){for(let i=0;i<3;i++){ctx.strokeStyle='#f8e6a0';ctx.lineWidth=2;ctx.beginPath();ctx.arc(fishFloatX,fishFloatY,9+i*5,0,Math.PI*2);ctx.stroke();}}
 if(fishMode==='reeling'||fishMode==='caught'){
  let fx=fishMode==='caught'?127:fishFloatX,fy=fishMode==='caught'?83:fishFloatY+16;
  drawPike(fx,fy,.85);
 }
 box(0,0,W,25,'#1d4964');text('🎣 HOLLAND · FISKEBONUS',9,17,'#ffe6a4',13);
 text('FISK '+fishCaught+' / 10',14,41,'#1c3f5b',13);
 text('+'+(fishCaught*50)+' COINS',274,41,'#1c3f5b',12);
 if(fishMode==='ready')text('TRYCK SKJUT FÖR ATT KASTA!',75,67,'#1d4c64',12);
 if(fishMode==='waiting')text('VÄNTA PÅ NAPP...',120,67,'#1d4c64',12);
 if(fishMode==='bite')text('NAPP! TRYCK SKJUT NU!',83,67,'#bb2d38',13);
 if(fishMode==='reeling')text('DU DRAR UPP FISKEN!',96,67,'#1d4c64',12);
 if(fishMode==='caught')text('+50 COINS! FISK FÅNGAD!',81,67,'#1d7b50',13);
 if(fishMsg>0&&fishMode==='waiting')text('FISKEN SLAPP UNDAN!',98,88,'#a7353b',11);
 hud.textContent='🎣 FISKEBONUS · '+score+' MYNT';
}

function updateWinter(){
 for(const m of winterMoose){
  if(!m.alive)continue;
  if(m.inv>0)m.inv--;
  m.x=m.base+Math.sin(frame*.017+m.base)*18;
  for(const b of bullets)if(m.inv===0&&hit({x:b.x,y:b.y,w:8,h:4},m)){
   b.x=-1000;m.hp--;m.inv=12;burst(m.x+23,m.y+18);
   if(m.hp<=0){m.alive=false;smokeVictory(m.x+23,m.y+18);beep(180,.18);}
   else beep(350,.09);
  }
  if(hit(hero,m)){hero.x=Math.max(0,hero.x-55);hero.vy=-4;beep(115,.18);}
 }
}
function drawWinter(){
 // The user's own illustration is used as the actual backdrop, not a lookalike.
 if(winterBackground.complete&&winterBackground.naturalWidth){
  const shift=(cam*.12)%210;

 }else box(0,0,W,H,'#081631');

 box(0,ground-4,W,4,'#b8edff');
 box(0,ground,W,H-ground,'#1b3765');
 box(0,ground,W,7,'#eefaff');
 for(let i=0;i<65;i++){

  circle(xx,yy,i%6===0?1.5:.8,'#e5f5ff');
 }
 // Snowy foreground rocks and pine trees, with gentle parallax.

 }

   box(x+17-w/2,y-5,w,4,'#c4e8fa');
  }
 }
 for(const q of coins)if(!q.taken&&q.x-cam>-10&&q.x-cam<W+10){
  circle(q.x-cam,q.y,6,'#ffd13d');box(q.x-cam-1,q.y-4,3,8,'#fff5b4');
 }
 for(const e of enemies)if(e.alive){
  let x=e.x-cam;if(x<-40||x>W+40)continue;drawDetailedEnemy(e,x,e.y);
 }
 for(const m of winterMoose)if(m.alive){

  drawMoose(x,m.y,.98);
  box(x+7,m.y-7,40,4,'#263c55');box(x+8,m.y-6,38*m.hp/6,2,'#ffd26a');
 }
 for(const b of bullets)box(b.x-cam,b.y,9,3,'#fff29a');

 let flag=world-85-cam;if(flag>-20&&flag<W+30){
  box(flag,ground-82,4,82,'#f6f8ff');box(flag+4,ground-82,40,22,'#2e84b9');

 }
 drawHero(hero.x-cam,hero.y);
 box(0,0,W,20,'#0a1936');text('🌌 VINTERNATT · NORRSKEN',7,14,'#fff2b6',11);

const held={left:new Set(),right:new Set(),jump:new Set(),shoot:new Set()};
const controls=['left','right','jump','shoot'];
const activeTouches=new Map();
function syncControls(){
 for(const k of controls){
  keys[k]=held[k].size>0;
  document.getElementById(k).classList.toggle('pressed',keys[k]);
 }
}
function releaseTouch(id){
 for(const k of controls)held[k].delete(id);
 activeTouches.delete(id);syncControls();
}
function clearControls(){
 activeTouches.clear();for(const k of controls)held[k].clear();syncControls();
 hero.vx=0;
}
function touchKey(target){
 const el=target&&target.closest?target.closest('[data-control]'):null;
 return el?el.dataset.control:null;
}
for(const k of controls){
 const el=document.getElementById(k);
 el.dataset.control=k;
 el.style.touchAction='none';
 el.addEventListener('contextmenu',e=>e.preventDefault());
}
// Global touch listeners still receive release events after fingers leave a button.
document.addEventListener('touchstart',e=>{
 let handled=false;
 for(const t of e.changedTouches){
  const key=touchKey(t.target);
  if(!key)continue;
  const id='t'+t.identifier;
  releaseTouch(id);activeTouches.set(id,key);held[key].add(id);handled=true;
 }
 if(handled){e.preventDefault();syncControls();}
},{passive:false});
document.addEventListener('touchmove',e=>{
 let handled=false;
 for(const t of e.changedTouches){
  const id='t'+t.identifier;
  if(!activeTouches.has(id))continue;
  handled=true;
  // A finger moved away from its original button: release it immediately.
  const origin=document.getElementById(activeTouches.get(id));
  const r=origin.getBoundingClientRect();
  if(t.clientX<r.left-12||t.clientX>r.right+12||t.clientY<r.top-12||t.clientY>r.bottom+12)releaseTouch(id);
 }
 if(handled)e.preventDefault();
},{passive:false});
for(const eventName of ['touchend','touchcancel'])document.addEventListener(eventName,e=>{
 let handled=false;
 for(const t of e.changedTouches){const id='t'+t.identifier;if(activeTouches.has(id)){releaseTouch(id);handled=true;}}
 if(handled)e.preventDefault();
},{passive:false});
