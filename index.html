(()=>{'use strict';document.getElementById('note').textContent='Spelmotorn redo ✓ · Tryck STARTA';const c=document.querySelector('#game'),ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;const hud=document.querySelector('#hud');let audio=null,muted=false;const keys={left:false,right:false,jump:false,shoot:false};const W=400,H=225,ground=184,world=3400;let flightTimer=0,flightDone=false;let hero,coins,enemies,bullets,particles,undercoins,boss,chairs,under=false,cam=0,score=0,frame=0,won=false,previousJump=false,shootDelay=0,started=false;function beep(f=440,d=.09,type='square',vol=.05){if(muted||!audio)return;try{let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,audio.currentTime);g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}function reset(){boss={x:3200,homeX:3200,y:ground-43,w:25,h:43,hp:10,phase:'fight',timer:0,angelX:3200,angelY:ground-43,inv:0,throwDelay:100,dir:-1};chairs=[];hero={x:36,y:135,vx:0,vy:0,w:15,h:23,face:1,grounded:false,air:100};score=0;frame=0;cam=0;ferry.x=2910;ferry.dx=0;under=false;won=false;flightTimer=0;flightDone=false;bullets=[];particles=[];coins=[];undercoins=[];enemies=[];for(let x=105;x<world-90;x+=77)coins.push({x,y:115+Math.sin(x*.021)*19,taken:false});for(let x=330;x<world-200;x+=260){if(streams.some(r=>x>r.a-30&&x<r.b+35))continue;enemies.push({x,y:ground-18,alive:true,dir:1,base:x,type:(Math.floor(x/260)%2?'beetle':'fox')});}for(let i=0;i<50;i++)undercoins.push({x:72+(i%10)*32,y:32+Math.floor(i/10)*29,taken:false});}function box(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(Math.round(x),Math.round(y),w,h)}function circle(x,y,r,col){ctx.fillStyle=col;ctx.beginPath();ctx.arc(Math.round(x),Math.round(y),r,0,Math.PI*2);ctx.fill()}function text(s,x,y,color='#fff',size=11){ctx.fillStyle=color;ctx.font=`bold ${size}px monospace`;ctx.fillText function drawBackdrop(){
 if(!backdropReady){box(0,0,W,ground,'#8fc9df');return;}
 const tile=445, shift=(cam*.095)%tile;
 ctx.imageSmoothingEnabled=false;
 for(let i=-1;i<3;i++){
  const x=Math.round(i*tile-shift);
  if(i%2){ctx.save();ctx.translate(x+tile,0);ctx.scale(-1,1);ctx.drawImage(backdrop,0,0,tile,ground+7);ctx.restore();}
  else ctx.drawImage(backdrop,x,0,tile,ground+7);
 }
 // A faint atmospheric veil keeps foreground platforms readable.
 box(0,125,W,ground-125,'#a5e2dd1b');
}

const held={left:new Set(),right:new Set(),jump:new Set(),shoot:new Set()};
const controls=['left','right','jump','shoot'];
const activeTouches=new Map();
function syncControls(){
 for(const k of controls){
  keys[k]=held[k].size>0;
  document.getElementById(k).classList.toggle('pressed',keys[k]);
 }
}
function releaseTouch(id){

}
function clearControls(){

function touchKey(target){
 const el=target&&target.closest?target.closest('[data-control]'):null;
 return el?el.dataset.control:null;
}
for(const k of controls){
 const el=document.getElementById(k);
 el.dataset.control=k;
 el.style.touchAction='none';

}
// Global touch listeners still receive release events after fingers leave a button.
document.addEventListener('touchstart',e=>{
 let handled=false;

  const key=touchKey(t.target);
  if(!key)continue;
  const id='t'+t.identifier;
  releaseTouch(id);activeTouches.set(id,key);held[key].add(id);handled=true;
 }

},{passive:false});
document.addEventListener('touchmove',e=>{
 let handled=false;
 for(const t of e.changedTouches){
  const id='t'+t.identifier;
  if(!activeTouches.has(id))continue;
  handled=true;
  // A finger moved away from its original button: release it immediately.
  const origin=document.getElementById(activeTouches.get(id));
  const r=origin.getBoundingClientRect();
  if(t.clientX<r.left-12||t.clientX>r.right+12||t.clientY<r.top-12||t.clientY>r.bottom+12)releaseTouch(id);

},{passive:false});
for(const eventName of ['touchend','touchcancel'])document.addEventListener(eventName,e=>{
